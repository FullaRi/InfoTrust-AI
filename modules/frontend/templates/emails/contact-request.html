<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Nouveau message – Formulaire de contact</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 600px;
            margin: 30px auto;
            background-color: #ffffff;
            border-radius: 6px;
            overflow: hidden;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }
        .header {
            background-color: #1f2937;
            color: #ffffff;
            padding: 16px 24px;
            font-size: 18px;
            font-weight: bold;
        }
        .content {
            padding: 24px;
            color: #333333;
        }
        .content p {
            margin: 8px 0;
        }
        .label {
            font-weight: bold;
            color: #111827;
        }
        .message-box {
            margin-top: 16px;
            padding: 16px;
            background-color: #f9fafb;
            border-left: 4px solid #2563eb;
            white-space: pre-line;
        }
        .footer {
            padding: 16px 24px;
            font-size: 12px;
            color: #6b7280;
            background-color: #f4f6f8;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        📩 Nouveau message via le formulaire de contact
    </div>

    <div class="content">
        <p><span class="label">Nom du client :</span> {{ name }}</p>
        <p><span class="label">Adresse e-mail :</span> {{ email }}</p>
        <p><span class="label">Sujet :</span> {{ subject }}</p>

        <div class="message-box">
            <span class="label">Message :</span><br><br>
            {{ message.replace('\n', '<br>') | safe }}
        </div>
    </div>

    <div class="footer">
        Ce message a été envoyé automatiquement depuis le formulaire de contact de votre application.
    </div>
</div>

</body>
</html>
